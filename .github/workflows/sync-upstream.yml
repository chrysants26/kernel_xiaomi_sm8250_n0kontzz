name: Sync Upstream Kernel Source

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: base

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz.git
          git fetch upstream

          # Check if there are new commits
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/base)

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date. No sync needed."
            exit 0
          fi

          echo "New commits found! Syncing..."
          echo "Local:  $LOCAL"
          echo "Remote: $REMOTE"

          git merge upstream/base --no-edit
          git push origin base

          echo "Sync complete!"

      - name: Create sync report
        if: success()
        run: |
          echo "## Upstream Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Synced from: bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz (base)" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### New commits:" >> $GITHUB_STEP_SUMMARY
          git log --oneline HEAD@{1}..HEAD >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "N/A" >> $GITHUB_STEP_SUMMARY
